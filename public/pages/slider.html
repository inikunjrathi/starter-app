<h2 class="mb-3">Image Slider</h2>
<div id="carousel" class="carousel slide mb-5" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button data-bs-target="#carousel" data-bs-slide-to="0" class="active"></button>
    <button data-bs-target="#carousel" data-bs-slide-to="1"></button>
    <button data-bs-target="#carousel" data-bs-slide-to="2"></button>
  </div>
  <div class="carousel-inner rounded">
    <div class="carousel-item active"><img src="images/slide1.svg" class="d-block w-100" alt="">
      <div class="carousel-caption"><h5>First slide</h5><p>Change text and images in pages/slider.html</p></div></div>
    <div class="carousel-item"><img src="images/slide2.svg" class="d-block w-100" alt="">
      <div class="carousel-caption"><h5>Second slide</h5></div></div>
    <div class="carousel-item"><img src="images/slide3.svg" class="d-block w-100" alt="">
      <div class="carousel-caption"><h5>Third slide</h5></div></div>
  </div>
  <button class="carousel-control-prev" data-bs-target="#carousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
  <button class="carousel-control-next" data-bs-target="#carousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
</div>

<h4>Range slider</h4>
<label class="form-label">Volume: <b id="rangeVal">50</b></label>
<input type="range" class="form-range" min="0" max="100" value="50" oninput="document.getElementById('rangeVal').textContent = this.value">
<script>
bootstrap.Carousel.getOrCreateInstance('#carousel').cycle();
</script>
