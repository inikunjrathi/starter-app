<h2 class="mb-3">Password Generator</h2>
<div class="card" style="max-width:500px"><div class="card-body">
  <div class="input-group mb-3">
    <input class="form-control font-monospace" id="pw" readonly>
    <button class="btn btn-outline-secondary" id="copy" title="Copy"><i class="bi bi-clipboard"></i></button>
  </div>
  <label class="form-label">Length: <b id="lenVal">16</b></label>
  <input type="range" class="form-range" id="len" min="6" max="40" value="16">
  <div class="form-check"><input class="form-check-input" type="checkbox" id="upper" checked><label class="form-check-label" for="upper">Uppercase</label></div>
  <div class="form-check"><input class="form-check-input" type="checkbox" id="nums" checked><label class="form-check-label" for="nums">Numbers</label></div>
  <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="syms" checked><label class="form-check-label" for="syms">Symbols</label></div>
  <button class="btn btn-primary w-100" id="gen">Generate</button>
  <hr>
  <label class="form-label">Check a password's strength</label>
  <input type="text" class="form-control mb-2" id="check" placeholder="Type a password">
  <div class="progress" style="height:8px"><div class="progress-bar" id="bar"></div></div>
  <small id="strength"></small>
</div></div>
<script>
const $ = id => document.getElementById(id);
function generate() {
  let chars = 'abcdefghijklmnopqrstuvwxyz';
  if ($('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if ($('nums').checked) chars += '0123456789';
  if ($('syms').checked) chars += '!@#$%^&*()-_=+[]{};:,.?';
  const rand = crypto.getRandomValues(new Uint32Array(+$('len').value)); // secure randomness
  $('pw').value = [...rand].map(r => chars[r % chars.length]).join('');
}
$('len').oninput = () => { $('lenVal').textContent = $('len').value; generate(); };
['upper', 'nums', 'syms'].forEach(id => $(id).onchange = generate);
$('gen').onclick = generate;
$('copy').onclick = () => navigator.clipboard.writeText($('pw').value);
$('check').oninput = () => {
  const p = $('check').value;
  const score = [p.length >= 8, p.length >= 12, /[A-Z]/.test(p), /\d/.test(p), /[^\w]/.test(p)].filter(Boolean).length;
  const [text, color] = [['Very weak', 'danger'], ['Weak', 'danger'], ['Fair', 'warning'], ['Good', 'info'], ['Strong', 'success'], ['Very strong', 'success']][score];
  $('bar').style.width = score * 20 + '%'; $('bar').className = `progress-bar bg-${color}`;
  $('strength').textContent = p ? text : '';
};
generate();
</script>
