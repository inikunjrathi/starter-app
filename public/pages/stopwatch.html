<div class="row g-4">
  <div class="col-md-6"><div class="card text-center"><div class="card-body">
    <h4>Stopwatch</h4>
    <div class="display-4 font-monospace my-3" id="sw">00:00.0</div>
    <button class="btn btn-success" id="swStart">Start</button>
    <button class="btn btn-secondary" id="swLap">Lap</button>
    <button class="btn btn-danger" id="swReset">Reset</button>
    <ol class="list-group list-group-numbered mt-3 text-start" id="laps"></ol>
  </div></div></div>
  <div class="col-md-6"><div class="card text-center"><div class="card-body">
    <h4>Countdown Timer</h4>
    <div class="input-group my-3 mx-auto" style="max-width:250px">
      <input type="number" class="form-control" id="mins" value="1" min="0"><span class="input-group-text">min</span>
      <input type="number" class="form-control" id="secs" value="0" min="0" max="59"><span class="input-group-text">sec</span>
    </div>
    <div class="display-4 font-monospace mb-3" id="cd">01:00</div>
    <button class="btn btn-primary" id="cdStart">Start</button>
    <button class="btn btn-danger" id="cdStop">Stop</button>
  </div></div></div>
  <div class="col-12"><div class="card text-center"><div class="card-body">
    <h4>Clock</h4><div class="display-5 font-monospace" id="clock"></div><div id="date" class="text-body-secondary"></div>
  </div></div></div>
</div>
<script>
const pad = n => String(n).padStart(2, '0');
const $ = id => document.getElementById(id);

// Stopwatch
let swTimer = null, swStartAt = 0, swElapsed = 0;
const fmt = ms => `${pad(Math.floor(ms / 60000))}:${pad(Math.floor(ms / 1000) % 60)}.${Math.floor(ms / 100) % 10}`;
$('swStart').onclick = () => {
  if (swTimer) { clearInterval(swTimer); swTimer = null; swElapsed += Date.now() - swStartAt; $('swStart').textContent = 'Start'; return; }
  swStartAt = Date.now();
  swTimer = setInterval(() => $('sw').textContent = fmt(swElapsed + Date.now() - swStartAt), 100);
  $('swStart').textContent = 'Pause';
};
$('swLap').onclick = () => { const li = document.createElement('li'); li.className = 'list-group-item'; li.textContent = $('sw').textContent; $('laps').prepend(li); };
$('swReset').onclick = () => { clearInterval(swTimer); swTimer = null; swElapsed = 0; $('sw').textContent = '00:00.0'; $('laps').innerHTML = ''; $('swStart').textContent = 'Start'; };

// Countdown
let cdTimer = null, left = 0;
const showCd = () => $('cd').textContent = `${pad(Math.floor(left / 60))}:${pad(left % 60)}`;
$('cdStart').onclick = () => {
  clearInterval(cdTimer);
  left = (+$('mins').value) * 60 + (+$('secs').value);
  showCd();
  cdTimer = setInterval(() => {
    left--; showCd();
    if (left <= 0) { clearInterval(cdTimer); $('cd').textContent = "Time's up!"; }
  }, 1000);
};
$('cdStop').onclick = () => clearInterval(cdTimer);

// Clock
const tick = () => { const d = new Date(); $('clock').textContent = d.toLocaleTimeString(); $('date').textContent = d.toDateString(); };
tick();
const clockTimer = setInterval(tick, 1000);

window.onPageLeave = () => { clearInterval(swTimer); clearInterval(cdTimer); clearInterval(clockTimer); };
</script>
