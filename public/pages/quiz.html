<h2 class="mb-3">Quiz</h2>
<div class="card" style="max-width:600px"><div class="card-body" id="quiz"></div></div>
<script>
// Edit your questions here. `answer` is the index of the correct option.
const questions = [
  { q: 'What does HTML stand for?', options: ['Hyper Text Markup Language', 'High Tech Modern Language', 'Home Tool Markup Language'], answer: 0 },
  { q: 'Which language styles web pages?', options: ['Java', 'CSS', 'Python'], answer: 1 },
  { q: 'Which database is NoSQL?', options: ['MySQL', 'PostgreSQL', 'MongoDB'], answer: 2 },
  { q: 'Which keyword declares a constant in JS?', options: ['var', 'const', 'let'], answer: 1 },
];
let i = 0, score = 0;
const box = document.getElementById('quiz');
function show() {
  if (i === questions.length) {
    box.innerHTML = `<h4>Score: ${score} / ${questions.length}</h4><button class="btn btn-primary mt-2" id="again">Try again</button>`;
    document.getElementById('again').onclick = () => { i = 0; score = 0; show(); };
    return;
  }
  const { q, options } = questions[i];
  box.innerHTML = `<div class="progress mb-3" style="height:6px"><div class="progress-bar" style="width:${i / questions.length * 100}%"></div></div>
    <p class="text-body-secondary mb-1">Question ${i + 1} of ${questions.length}</p><h5>${q}</h5>
    <div class="d-grid gap-2 mt-3">${options.map((o, n) => `<button class="btn btn-outline-primary text-start" data-n="${n}">${o}</button>`).join('')}</div>`;
  box.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    const right = +b.dataset.n === questions[i].answer;
    if (right) score++;
    box.querySelectorAll('[data-n]').forEach(x => { x.disabled = true; if (+x.dataset.n === questions[i].answer) x.className = 'btn btn-success text-start'; });
    if (!right) b.className = 'btn btn-danger text-start';
    setTimeout(() => { i++; show(); }, 800);
  });
}
show();
</script>
