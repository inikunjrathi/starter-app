<h2 class="mb-3">Data Table</h2>
<div class="row g-2 mb-3">
  <div class="col-md-6"><input class="form-control" id="search" placeholder="Search..."></div>
  <div class="col-md-3"><select class="form-select" id="filter"><option value="">All departments</option></select></div>
</div>
<table class="table table-hover">
  <thead><tr id="head"></tr></thead>
  <tbody id="body"></tbody>
</table>
<nav><ul class="pagination" id="pages"></ul></nav>
<script>
// Replace this with your own data (or load it: rows = await api('/api/data/xyz'))
const rows = [
  { name: 'Aarav', dept: 'CSE', marks: 88, city: 'Pune' },     { name: 'Diya', dept: 'IT', marks: 92, city: 'Mumbai' },
  { name: 'Kabir', dept: 'ENTC', marks: 75, city: 'Nashik' },  { name: 'Meera', dept: 'CSE', marks: 81, city: 'Pune' },
  { name: 'Rohan', dept: 'MECH', marks: 69, city: 'Nagpur' },  { name: 'Saanvi', dept: 'IT', marks: 95, city: 'Pune' },
  { name: 'Vihaan', dept: 'CSE', marks: 73, city: 'Mumbai' },  { name: 'Anaya', dept: 'ENTC', marks: 84, city: 'Thane' },
  { name: 'Ishaan', dept: 'MECH', marks: 58, city: 'Pune' },   { name: 'Kiara', dept: 'IT', marks: 77, city: 'Nashik' },
  { name: 'Arjun', dept: 'CSE', marks: 90, city: 'Nagpur' },   { name: 'Myra', dept: 'ENTC', marks: 66, city: 'Mumbai' },
];
const cols = Object.keys(rows[0]);
const PER_PAGE = 5;
let sortKey = 'name', asc = true, page = 1;
const $ = id => document.getElementById(id);

$('filter').innerHTML += [...new Set(rows.map(r => r.dept))].map(d => `<option>${d}</option>`).join('');
function render() {
  const q = $('search').value.toLowerCase(), dept = $('filter').value;
  const list = rows
    .filter(r => (!dept || r.dept === dept) && Object.values(r).join(' ').toLowerCase().includes(q))
    .sort((a, b) => (a[sortKey] > b[sortKey] ? 1 : -1) * (asc ? 1 : -1));
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  page = Math.min(page, pages);
  $('head').innerHTML = cols.map(c => `<th role="button" data-c="${c}">${label(c)} ${c === sortKey ? (asc ? '▲' : '▼') : ''}</th>`).join('');
  $('body').innerHTML = list.slice((page - 1) * PER_PAGE, page * PER_PAGE)
    .map(r => `<tr>${cols.map(c => `<td>${r[c]}</td>`).join('')}</tr>`).join('') || '<tr><td colspan="9">No results</td></tr>';
  $('pages').innerHTML = Array.from({ length: pages }, (_, i) =>
    `<li class="page-item ${i + 1 === page ? 'active' : ''}"><a class="page-link" href="#" data-p="${i + 1}">${i + 1}</a></li>`).join('');
  document.querySelectorAll('[data-c]').forEach(th => th.onclick = () => {
    asc = th.dataset.c === sortKey ? !asc : true; sortKey = th.dataset.c; render();
  });
  document.querySelectorAll('[data-p]').forEach(a => a.onclick = e => { e.preventDefault(); page = +a.dataset.p; render(); });
}
$('search').oninput = $('filter').onchange = () => { page = 1; render(); };
render();
</script>
