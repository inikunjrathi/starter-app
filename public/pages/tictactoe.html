<h2 class="mb-3">Tic Tac Toe</h2>
<h5 id="status">Player X's turn</h5>
<div id="board" class="d-grid gap-2 my-3" style="grid-template-columns:repeat(3,90px)"></div>
<button class="btn btn-primary" id="restart">Restart</button>
<p class="mt-3">X: <b id="sx">0</b> &nbsp; O: <b id="so">0</b> &nbsp; Draws: <b id="sd">0</b></p>
<script>
const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let cells, turn, over;
const scores = { X: 0, O: 0, D: 0 };
function start() {
  cells = Array(9).fill(''); turn = 'X'; over = false;
  document.getElementById('status').textContent = "Player X's turn";
  document.getElementById('board').innerHTML = cells.map((_, i) =>
    `<button class="btn btn-outline-secondary fs-1 fw-bold" style="height:90px" data-i="${i}"></button>`).join('');
  document.querySelectorAll('#board button').forEach(b => b.onclick = () => play(b));
}
function play(b) {
  const i = +b.dataset.i;
  if (over || cells[i]) return;
  cells[i] = turn; b.textContent = turn; b.classList.add(turn === 'X' ? 'text-primary' : 'text-danger');
  const win = lines.find(l => l.every(k => cells[k] === turn));
  const status = document.getElementById('status');
  if (win) {
    over = true; scores[turn]++; status.textContent = `Player ${turn} wins!`;
    win.forEach(k => document.querySelector(`[data-i="${k}"]`).classList.add('btn-warning'));
  } else if (cells.every(Boolean)) {
    over = true; scores.D++; status.textContent = "It's a draw!";
  } else {
    turn = turn === 'X' ? 'O' : 'X'; status.textContent = `Player ${turn}'s turn`;
  }
  document.getElementById('sx').textContent = scores.X;
  document.getElementById('so').textContent = scores.O;
  document.getElementById('sd').textContent = scores.D;
}
document.getElementById('restart').onclick = start;
start();
</script>
