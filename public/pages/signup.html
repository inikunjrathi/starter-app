<div class="card mx-auto" style="max-width:400px">
  <div class="card-body">
    <h3 class="mb-3">Sign Up</h3>
    <form id="signupForm">
      <input class="form-control mb-2" name="name" placeholder="Name" required>
      <input class="form-control mb-2" name="email" type="email" placeholder="Email" required>
      <input class="form-control mb-3" name="password" type="password" placeholder="Password (min 6)" minlength="6" required>
      <button class="btn btn-success w-100">Create account</button>
      <div id="msg" class="mt-2 text-danger"></div>
    </form>
    <p class="mt-3 mb-0 small">Have an account? <a href="#login">Login</a></p>
  </div>
</div>
<script>
document.getElementById('signupForm').onsubmit = async e => {
  e.preventDefault();
  try {
    auth.login(await api('/api/signup', Object.fromEntries(new FormData(e.target))));
    location.hash = '#home';
  } catch (err) { document.getElementById('msg').textContent = err.message; }
};
</script>
