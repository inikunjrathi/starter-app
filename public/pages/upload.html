<h2 class="mb-3">Image Upload Preview</h2>
<div class="border border-2 border-dashed rounded p-5 text-center mb-3" id="drop" style="border-style:dashed!important">
  <i class="bi bi-cloud-upload fs-1"></i>
  <p class="mb-2">Drag & drop images here, or</p>
  <label class="btn btn-primary">Choose files<input type="file" id="file" accept="image/*" multiple hidden></label>
</div>
<div class="row g-3" id="previews"></div>
<script>
// Preview only (files stay in the browser). To store them, send the data URL with api() or add multer to the server.
const drop = document.getElementById('drop');
function show(files) {
  [...files].filter(f => f.type.startsWith('image/')).forEach(f => {
    const reader = new FileReader();
    reader.onload = () => {
      const col = document.createElement('div');
      col.className = 'col-6 col-md-3';
      col.innerHTML = `<div class="card"><img class="card-img-top" style="height:150px;object-fit:cover"><div class="card-body p-2 small text-truncate"></div></div>`;
      col.querySelector('img').src = reader.result;
      col.querySelector('.card-body').textContent = `${f.name} (${(f.size / 1024).toFixed(0)} KB)`;
      document.getElementById('previews').appendChild(col);
    };
    reader.readAsDataURL(f);
  });
}
document.getElementById('file').onchange = e => show(e.target.files);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('bg-body-tertiary'); };
drop.ondragleave = () => drop.classList.remove('bg-body-tertiary');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('bg-body-tertiary'); show(e.dataTransfer.files); };
</script>
