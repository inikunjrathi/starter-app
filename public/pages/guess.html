<h2 class="mb-3">Guess the Number</h2>
<div class="card" style="max-width:400px"><div class="card-body">
  <p>I'm thinking of a number between 1 and 100.</p>
  <form id="guessForm" class="input-group mb-3">
    <input type="number" class="form-control" id="guessIn" min="1" max="100" required>
    <button class="btn btn-primary">Guess</button>
  </form>
  <div id="hint" class="fs-5"></div>
  <p class="small text-body-secondary mb-0">Tries: <span id="tries">0</span> · Best: <span id="best">-</span></p>
  <button class="btn btn-link px-0 d-none" id="newGame">Play again</button>
</div></div>
<script>
let target, tries;
const best = () => localStorage.getItem('guessBest');
function reset() {
  target = Math.floor(Math.random() * 100) + 1; tries = 0;
  document.getElementById('tries').textContent = 0;
  document.getElementById('hint').textContent = '';
  document.getElementById('best').textContent = best() || '-';
  document.getElementById('newGame').classList.add('d-none');
}
document.getElementById('guessForm').onsubmit = e => {
  e.preventDefault();
  const n = +document.getElementById('guessIn').value;
  const hint = document.getElementById('hint');
  document.getElementById('tries').textContent = ++tries;
  if (n === target) {
    hint.innerHTML = `<span class="text-success">🎉 Correct! It was ${target}.</span>`;
    if (!best() || tries < +best()) localStorage.setItem('guessBest', tries);
    document.getElementById('best').textContent = best();
    document.getElementById('newGame').classList.remove('d-none');
  } else hint.textContent = n < target ? '⬆️ Too low' : '⬇️ Too high';
  e.target.reset();
};
document.getElementById('newGame').onclick = reset;
reset();
</script>
