<h2 class="mb-3">To-Do List</h2>
<form id="todoForm" class="input-group mb-3" style="max-width:500px">
  <input class="form-control" id="todoText" placeholder="New task" required>
  <button class="btn btn-primary">Add</button>
</form>
<ul class="list-group" id="todos" style="max-width:500px"></ul>
<script>
let todos = JSON.parse(localStorage.getItem('todos') || '[]');
const save = () => { localStorage.setItem('todos', JSON.stringify(todos)); render(); };
function render() {
  const ul = document.getElementById('todos');
  ul.innerHTML = '';
  todos.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = 'list-group-item d-flex align-items-center gap-2';
    li.innerHTML = `<input type="checkbox" class="form-check-input" ${t.done ? 'checked' : ''}>
      <span class="flex-grow-1 ${t.done ? 'text-decoration-line-through' : ''}"></span>
      <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>`;
    li.querySelector('span').textContent = t.text;
    li.querySelector('input').onchange = () => { t.done = !t.done; save(); };
    li.querySelector('button').onclick = () => { todos.splice(i, 1); save(); };
    ul.appendChild(li);
  });
}
document.getElementById('todoForm').onsubmit = e => {
  e.preventDefault();
  todos.push({ text: document.getElementById('todoText').value, done: false });
  e.target.reset(); save();
};
render();
</script>
