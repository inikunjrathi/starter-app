<h2 class="mb-3">Expense Tracker</h2>
<div class="row g-3 mb-3">
  <div class="col-md-4"><div class="card text-bg-success"><div class="card-body"><small>Income</small><h3 id="inc">₹0</h3></div></div></div>
  <div class="col-md-4"><div class="card text-bg-danger"><div class="card-body"><small>Expense</small><h3 id="exp">₹0</h3></div></div></div>
  <div class="col-md-4"><div class="card text-bg-primary"><div class="card-body"><small>Balance</small><h3 id="bal">₹0</h3></div></div></div>
</div>
<form id="txForm" class="row g-2 mb-3">
  <div class="col-md-5"><input class="form-control" name="text" placeholder="Description" required></div>
  <div class="col-md-3"><input class="form-control" name="amount" type="number" min="1" placeholder="Amount" required></div>
  <div class="col-md-2"><select class="form-select" name="type"><option value="exp">Expense</option><option value="inc">Income</option></select></div>
  <div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div>
</form>
<ul class="list-group" id="txList"></ul>
<script>
let txs = JSON.parse(localStorage.getItem('txs') || '[]');
const save = () => { localStorage.setItem('txs', JSON.stringify(txs)); render(); };
function render() {
  const sum = type => txs.filter(t => t.type === type).reduce((s, t) => s + t.amount, 0);
  document.getElementById('inc').textContent = '₹' + sum('inc');
  document.getElementById('exp').textContent = '₹' + sum('exp');
  document.getElementById('bal').textContent = '₹' + (sum('inc') - sum('exp'));
  const ul = document.getElementById('txList');
  ul.innerHTML = txs.length ? '' : '<li class="list-group-item text-body-secondary">No transactions</li>';
  txs.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = `list-group-item d-flex justify-content-between border-start border-4 border-${t.type === 'inc' ? 'success' : 'danger'}`;
    li.innerHTML = `<span></span><span>${t.type === 'inc' ? '+' : '−'}₹${t.amount} <button class="btn btn-sm btn-link text-danger p-0 ms-2"><i class="bi bi-x-lg"></i></button></span>`;
    li.querySelector('span').textContent = t.text;
    li.querySelector('button').onclick = () => { txs.splice(i, 1); save(); };
    ul.appendChild(li);
  });
}
document.getElementById('txForm').onsubmit = e => {
  e.preventDefault();
  const f = e.target;
  txs.unshift({ text: f.elements.text.value, amount: +f.elements.amount.value, type: f.elements.type.value });
  f.reset(); save();
};
render();
</script>
