<h2 class="mb-3">Calculator</h2>
<div class="card calc" style="max-width:320px">
  <div class="card-body">
    <input class="form-control form-control-lg text-end mb-3" id="display" readonly value="0">
    <div class="row g-2" id="keys"></div>
  </div>
</div>
<script>
const display = document.getElementById('display');
const keys = ['C', '(', ')', '/', '7', '8', '9', '*', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', '⌫', '='];
document.getElementById('keys').innerHTML = keys.map(k =>
  `<div class="col-3"><button class="btn w-100 ${k === '=' ? 'btn-success' : /[0-9.]/.test(k) ? 'btn-light border' : 'btn-secondary'}">${k}</button></div>`).join('');

document.querySelectorAll('#keys button').forEach(b => b.onclick = () => {
  const k = b.textContent, v = display.value;
  if (k === 'C') display.value = '0';
  else if (k === '⌫') display.value = v.length > 1 ? v.slice(0, -1) : '0';
  else if (k === '=') {
    // only digits/operators reach here, so evaluating is safe
    try { display.value = /^[\d+\-*/().\s]+$/.test(v) ? String(Function(`return (${v})`)()) : 'Error'; }
    catch { display.value = 'Error'; }
  }
  else display.value = (v === '0' || v === 'Error') ? k : v + k;
});
</script>
