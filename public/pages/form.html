<h2 class="mb-3">Contact Form</h2>
<form id="contactForm" class="row g-3 needs-validation" novalidate style="max-width:700px">
  <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
  <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div>
  <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" type="tel" pattern="[0-9]{10}" placeholder="10 digits"></div>
  <div class="col-md-6"><label class="form-label">Date</label><input class="form-control" name="date" type="date"></div>
  <div class="col-md-6"><label class="form-label">Subject</label>
    <select class="form-select" name="subject" required><option value="">Choose...</option><option>General</option><option>Support</option><option>Feedback</option></select></div>
  <div class="col-md-6"><label class="form-label d-block">Gender</label>
    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Male" id="g1"><label class="form-check-label" for="g1">Male</label></div>
    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Female" id="g2"><label class="form-check-label" for="g2">Female</label></div></div>
  <div class="col-12"><label class="form-label">Message</label><textarea class="form-control" name="message" rows="4" required></textarea></div>
  <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="agree" required><label class="form-check-label" for="agree">I agree to the terms</label></div></div>
  <div class="col-12"><button class="btn btn-primary">Submit</button></div>
  <div class="col-12" id="msg"></div>
</form>
<script>
// Saves into MongoDB collection "contacts". Change the name to save elsewhere.
const form = document.getElementById('contactForm');
form.onsubmit = async e => {
  e.preventDefault();
  form.classList.add('was-validated');
  if (!form.checkValidity()) return;
  const msg = document.getElementById('msg');
  try {
    await api('/api/data/contacts', Object.fromEntries(new FormData(form)));
    msg.innerHTML = '<div class="alert alert-success">Submitted!</div>';
    form.reset(); form.classList.remove('was-validated');
  } catch (err) { msg.innerHTML = `<div class="alert alert-danger">${err.message}</div>`; }
};
</script>
