<h2 class="mb-3">BMI Calculator</h2>
<form id="bmiForm" class="card" style="max-width:400px"><div class="card-body">
  <label class="form-label">Height (cm)</label>
  <input type="number" class="form-control mb-2" id="h" min="50" max="250" required>
  <label class="form-label">Weight (kg)</label>
  <input type="number" class="form-control mb-3" id="w" min="10" max="300" step="0.1" required>
  <button class="btn btn-primary w-100">Calculate</button>
  <div id="result" class="mt-3"></div>
</div></form>
<script>
const ranges = [[18.5, 'Underweight', 'info'], [25, 'Normal', 'success'], [30, 'Overweight', 'warning'], [Infinity, 'Obese', 'danger']];
document.getElementById('bmiForm').onsubmit = e => {
  e.preventDefault();
  const m = document.getElementById('h').value / 100;
  const bmi = document.getElementById('w').value / (m * m);
  const [, text, color] = ranges.find(([max]) => bmi < max);
  document.getElementById('result').innerHTML = `<div class="alert alert-${color} mb-0">BMI: <b>${bmi.toFixed(1)}</b> (${text})</div>`;
};
</script>
