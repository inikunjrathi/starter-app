<!DOCTYPE html>
<html>
<head>
  <title>Contact - My Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">My Website</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="/shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="/calculator.html">Calculator</a></li>
        <li class="nav-item"><a class="nav-link" href="/sidebar.html">Sidebar</a></li>
        <li class="nav-item"><a class="nav-link active" href="/contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="/messages.html">Messages</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <div class="card" style="max-width:600px">
    <div class="card-body">
      <h4 class="mb-3">Contact Us</h4>
      <form action="/add" method="post">

        <label class="form-label">Name</label>
        <input class="form-control mb-3" name="name" type="text" required>

        <label class="form-label">Email</label>
        <input class="form-control mb-3" name="email" type="email" required>

        <label class="form-label">Message</label>
        <textarea class="form-control mb-3" name="message" rows="3" required></textarea>

        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
