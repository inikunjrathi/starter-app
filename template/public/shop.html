<!DOCTYPE html>
<html>
<head>
  <title>Shop - My Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">My Website</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link active" href="/shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="/calculator.html">Calculator</a></li>
        <li class="nav-item"><a class="nav-link" href="/sidebar.html">Sidebar</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="/messages.html">Messages</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <div class="row">
    <div class="col-md-8">
      <h2 class="mb-3">Products</h2>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card">
            <img src="/images/headphones.svg" class="card-img-top">
            <div class="card-body">
              <h5>Headphones</h5><p>Rs. 1999</p>
              <button class="btn btn-primary" onclick="addToCart('Headphones', 1999)">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <img src="/images/watch.svg" class="card-img-top">
            <div class="card-body">
              <h5>Watch</h5><p>Rs. 3499</p>
              <button class="btn btn-primary" onclick="addToCart('Watch', 3499)">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <img src="/images/camera.svg" class="card-img-top">
            <div class="card-body">
              <h5>Camera</h5><p>Rs. 24999</p>
              <button class="btn btn-primary" onclick="addToCart('Camera', 24999)">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <img src="/images/shoes.svg" class="card-img-top">
            <div class="card-body">
              <h5>Shoes</h5><p>Rs. 2599</p>
              <button class="btn btn-primary" onclick="addToCart('Shoes', 2599)">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <h2 class="mb-3">Cart <span class="badge bg-primary" id="count">0</span></h2>
      <ul class="list-group mb-3" id="cart"></ul>
      <h4>Total: Rs. <span id="total">0</span></h4>
      <button class="btn btn-danger" onclick="clearCart()">Clear Cart</button>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
// cart is saved in the browser (localStorage) so it stays after a refresh
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, price) {
  cart.push({ name, price });
  showCart();
}

function clearCart() {
  cart = [];
  showCart();
}

function showCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
  let html = "";
  let total = 0;
  cart.forEach(item => {
    html += `<li class="list-group-item d-flex justify-content-between">${item.name}<span>Rs. ${item.price}</span></li>`;
    total += item.price;
  });
  document.getElementById("cart").innerHTML = html;
  document.getElementById("total").textContent = total;
  document.getElementById("count").textContent = cart.length;
}

showCart();
</script>

</body>
</html>
