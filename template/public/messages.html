<!DOCTYPE html>
<html>
<head>
  <title>Messages - My Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">My Website</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="/shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="/calculator.html">Calculator</a></li>
        <li class="nav-item"><a class="nav-link" href="/sidebar.html">Sidebar</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link active" href="/messages.html">Messages</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2 id="heading" class="mb-3">Messages</h2>
  <table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Name</th><th>Email</th><th>Message</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
// get all records from MongoDB and add one table row per record
fetch("/api/messages")
  .then(res => res.json())
  .then(items => {
    const list = document.getElementById("list");
    items.forEach(item => {
      const row = list.insertRow();
      row.insertCell().textContent = item.name;
      row.insertCell().textContent = item.email;
      row.insertCell().textContent = item.message;
    });
  });
</script>

</body>
</html>
