<!DOCTYPE html>
<html>
<head>
  <title>Home - My Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">My Website</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="/shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="/calculator.html">Calculator</a></li>
        <li class="nav-item"><a class="nav-link" href="/sidebar.html">Sidebar</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="/messages.html">Messages</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <!-- Image carousel (slider) -->
  <div id="slider" class="carousel slide mb-4" data-bs-ride="carousel">
    <div class="carousel-inner rounded">
      <div class="carousel-item active">
        <img src="/images/slide1.svg" class="d-block w-100" alt="slide 1">
      </div>
      <div class="carousel-item">
        <img src="/images/slide2.svg" class="d-block w-100" alt="slide 2">
      </div>
      <div class="carousel-item">
        <img src="/images/slide3.svg" class="d-block w-100" alt="slide 3">
      </div>
    </div>
    <button class="carousel-control-prev" data-bs-target="#slider" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-target="#slider" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <div class="row g-3">
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Gallery</h5>
          <p class="card-text">Click a picture to see it bigger.</p>
        </div>
        <div class="card-footer"><a href="/gallery.html">Open</a></div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Shop</h5>
          <p class="card-text">Add products to the cart and see the total.</p>
        </div>
        <div class="card-footer"><a href="/shop.html">Open</a></div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Calculator</h5>
          <p class="card-text">A simple calculator in JavaScript.</p>
        </div>
        <div class="card-footer"><a href="/calculator.html">Open</a></div>
      </div>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
