<!DOCTYPE html>
<html>
<head>
  <title>Home - CarePlus Hospital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-info" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">CarePlus Hospital</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/patients.html">Patients</a></li>
        <li class="nav-item"><a class="nav-link" href="/doctors.html">Doctors</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <!-- Image carousel (slider) -->
  <div id="slider" class="carousel slide mb-4" data-bs-ride="carousel">
    <div class="carousel-inner rounded">
      <div class="carousel-item active">
        <img src="/images/banner1.svg" class="d-block w-100" alt="slide 1">
      </div>
      <div class="carousel-item">
        <img src="/images/banner2.svg" class="d-block w-100" alt="slide 2">
      </div>
      <div class="carousel-item">
        <img src="/images/banner3.svg" class="d-block w-100" alt="slide 3">
      </div>
    </div>
    <button class="carousel-control-prev" data-bs-target="#slider" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-target="#slider" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <div class="card" style="max-width:600px">
    <div class="card-body">
      <h4 class="mb-3">Register Patient</h4>
      <form action="/add" method="post">

        <label class="form-label">Patient Name</label>
        <input class="form-control mb-3" name="name" type="text" required>

        <label class="form-label">Age</label>
        <input class="form-control mb-3" name="age" type="number" min="0" max="120" required>

        <label class="form-label">Gender</label>
        <select class="form-select mb-3" name="gender" required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>

        <label class="form-label">Blood Group</label>
        <select class="form-select mb-3" name="bloodGroup" required>
          <option value="">Select Blood Group</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>AB+</option>
          <option>AB-</option>
          <option>O+</option>
          <option>O-</option>
        </select>

        <label class="form-label">Disease</label>
        <input class="form-control mb-3" name="disease" type="text" required>

        <label class="form-label">Doctor</label>
        <select class="form-select mb-3" name="doctor" required>
          <option value="">Select Doctor</option>
          <option>Dr. Asha Rao</option>
          <option>Dr. Vikram Shah</option>
          <option>Dr. Neha Kulkarni</option>
          <option>Dr. Arjun Mehta</option>
          <option>Dr. Priya Nair</option>
          <option>Dr. Rahul Joshi</option>
        </select>

        <label class="form-label">Admission Date</label>
        <input class="form-control mb-3" name="admissionDate" type="date" required>

        <label class="form-label">Phone</label>
        <input class="form-control mb-3" name="phone" type="tel" pattern="[0-9]{10}" placeholder="10 digits" required>

        <button type="submit" class="btn btn-primary">Register</button>
      </form>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
