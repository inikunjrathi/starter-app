<!DOCTYPE html>
<html>
<head>
  <title>All Patients - CarePlus Hospital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-info" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">CarePlus Hospital</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="/patients.html">Patients</a></li>
        <li class="nav-item"><a class="nav-link" href="/doctors.html">Doctors</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2 id="heading" class="mb-3">All Patients</h2>
  <table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Patient Name</th><th>Age</th><th>Gender</th><th>Blood Group</th><th>Disease</th><th>Doctor</th><th>Admission Date</th><th>Phone</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
// get all records from MongoDB and add one table row per record
fetch("/api/patients")
  .then(res => res.json())
  .then(items => {
    const list = document.getElementById("list");
    items.forEach(item => {
      const row = list.insertRow();
      row.insertCell().textContent = item.name;
      row.insertCell().textContent = item.age;
      row.insertCell().textContent = item.gender;
      row.insertCell().textContent = item.bloodGroup;
      row.insertCell().textContent = item.disease;
      row.insertCell().textContent = item.doctor;
      row.insertCell().textContent = item.admissionDate;
      row.insertCell().textContent = item.phone;
    });
  });
</script>

</body>
</html>
