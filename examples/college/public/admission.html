<!DOCTYPE html>
<html>
<head>
  <title>Admission - Sunrise College</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-success" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">Sunrise College</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/courses.html">Courses</a></li>
        <li class="nav-item"><a class="nav-link active" href="/admission.html">Admission</a></li>
        <li class="nav-item"><a class="nav-link" href="/students.html">Students</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <div class="card" style="max-width:600px">
    <div class="card-body">
      <h4 class="mb-3">Admission Form</h4>
      <form action="/add" method="post">

        <label class="form-label">Full Name</label>
        <input class="form-control mb-3" name="name" type="text" required>

        <label class="form-label">Email</label>
        <input class="form-control mb-3" name="email" type="email" required>

        <label class="form-label">Phone</label>
        <input class="form-control mb-3" name="phone" type="tel" pattern="[0-9]{10}" placeholder="10 digits" required>

        <label class="form-label">Date of Birth</label>
        <input class="form-control mb-3" name="dob" type="date" required>

        <label class="form-label">Gender</label>
        <select class="form-select mb-3" name="gender" required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>

        <label class="form-label">Course</label>
        <select class="form-select mb-3" name="course" required>
          <option value="">Select Course</option>
          <option>B.Tech Computer Engineering</option>
          <option>B.Tech Information Technology</option>
          <option>B.Tech Electronics</option>
          <option>BBA</option>
          <option>B.Sc Data Science</option>
          <option>MBA</option>
        </select>

        <label class="form-label">12th Percentage</label>
        <input class="form-control mb-3" name="percentage" type="number" min="0" max="100" step="0.01" required>

        <label class="form-label">Address</label>
        <textarea class="form-control mb-3" name="address" rows="3" required></textarea>

        <button type="submit" class="btn btn-primary">Submit Application</button>
      </form>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
