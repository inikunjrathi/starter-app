<!DOCTYPE html>
<html>
<head>
  <title>Participants - TechFest 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">TechFest 2026</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/events.html">Events</a></li>
        <li class="nav-item"><a class="nav-link" href="/register.html">Register</a></li>
        <li class="nav-item"><a class="nav-link active" href="/participants.html">Participants</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2 id="heading" class="mb-3">Participants</h2>
  <table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Full Name</th><th>Email</th><th>Phone</th><th>College</th><th>Year</th><th>Event</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
// show only one event if the link has ?event=...
const event = new URLSearchParams(location.search).get("event");
if (event) document.getElementById("heading").textContent += " - " + event;

// get all records from MongoDB and add one table row per record
fetch("/api/registrations")
  .then(res => res.json())
  .then(items => {
    const list = document.getElementById("list");
    items.forEach(item => {
      if (event && item.event !== event) return;
      const row = list.insertRow();
      row.insertCell().textContent = item.name;
      row.insertCell().textContent = item.email;
      row.insertCell().textContent = item.phone;
      row.insertCell().textContent = item.college;
      row.insertCell().textContent = item.year;
      row.insertCell().textContent = item.event;
    });
  });
</script>

</body>
</html>
