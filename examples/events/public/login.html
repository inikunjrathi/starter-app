<!DOCTYPE html>
<html>
<head>
  <title>Login - TechFest 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>


<div class="container my-4">
  <div class="card mx-auto mt-5" style="max-width:400px">
    <div class="card-body">
      <h2 class="text-center">TechFest 2026</h2>
      <h5 class="text-center text-secondary mb-4">Login</h5>
      <form action="/login" method="post">
        <input class="form-control mb-3" name="email" type="email" placeholder="Email" required>
        <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <p class="text-center mt-3 mb-0">New user? <a href="/signup.html">Sign up</a></p>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
