<div class="row g-4">
  <div class="col-lg-5"><div class="card"><div class="card-body">
    <h4 class="mb-3">Book a Room</h4>
    <form id="bookForm"></form>
    <p class="mt-2 mb-0" id="estimate"></p>
  </div></div></div>
  <div class="col-lg-7"><h4 class="mb-3">My Bookings</h4><div id="myBookings"></div></div>
</div>
<script>
const nights = d => Math.round((new Date(d.checkOut) - new Date(d.checkIn)) / 86400000);
crudForm({
  collection: 'bookings', form: '#bookForm', table: '#myBookings', submitText: 'Book Now',
  validate: d => {
    const room = ROOMS.find(r => r.type === d.roomType);
    if (d.checkIn < new Date().toLocaleDateString('en-CA')) return 'Check-in cannot be in the past';
    if (nights(d) < 1) return 'Check-out must be after check-in';
    if (d.guests > room.guests) return `${room.type} fits at most ${room.guests} guests`;
  },
});
// live price estimate
const form = document.getElementById('bookForm');
form.oninput = () => {
  const d = Object.fromEntries(new FormData(form));
  const room = ROOMS.find(r => r.type === d.roomType), n = nights(d);
  document.getElementById('estimate').textContent = room && n > 0 ? `${n} night(s) × ₹${room.price} = ₹${n * room.price}` : '';
};
</script>
