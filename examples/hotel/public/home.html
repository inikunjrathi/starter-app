<!DOCTYPE html>
<html>
<head>
  <title>Home - The Grand Stay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">The Grand Stay</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/rooms.html">Rooms</a></li>
        <li class="nav-item"><a class="nav-link" href="/booking.html">Book a Room</a></li>
        <li class="nav-item"><a class="nav-link" href="/bookings.html">Bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <!-- Image carousel (slider) -->
  <div id="slider" class="carousel slide mb-4" data-bs-ride="carousel">
    <div class="carousel-inner rounded">
      <div class="carousel-item active">
        <img src="/images/banner1.svg" class="d-block w-100" alt="slide 1">
      </div>
      <div class="carousel-item">
        <img src="/images/banner2.svg" class="d-block w-100" alt="slide 2">
      </div>
      <div class="carousel-item">
        <img src="/images/banner3.svg" class="d-block w-100" alt="slide 3">
      </div>
    </div>
    <button class="carousel-control-prev" data-bs-target="#slider" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-target="#slider" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <h3 class="mb-3">Why stay with us</h3>
  <div class="row g-3">
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Free Breakfast</h5>
          <p class="card-text">Buffet breakfast with every Deluxe room and above.</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Airport Pickup</h5>
          <p class="card-text">Free pickup for stays of 3 nights or more.</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">24x7 Service</h5>
          <p class="card-text">Room service and front desk any time.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
