<!DOCTYPE html>
<html>
<head>
  <title>Book a Room - The Grand Stay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">The Grand Stay</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/rooms.html">Rooms</a></li>
        <li class="nav-item"><a class="nav-link active" href="/booking.html">Book a Room</a></li>
        <li class="nav-item"><a class="nav-link" href="/bookings.html">Bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <div class="card" style="max-width:600px">
    <div class="card-body">
      <h4 class="mb-3">Book a Room</h4>
      <form action="/add" method="post">

        <label class="form-label">Guest Name</label>
        <input class="form-control mb-3" name="guestName" type="text" required>

        <label class="form-label">Email</label>
        <input class="form-control mb-3" name="email" type="email" required>

        <label class="form-label">Phone</label>
        <input class="form-control mb-3" name="phone" type="tel" pattern="[0-9]{10}" placeholder="10 digits" required>

        <label class="form-label">Room Type</label>
        <select class="form-select mb-3" name="roomType" required>
          <option value="">Select Room Type</option>
          <option>Standard</option>
          <option>Deluxe</option>
          <option>Suite</option>
          <option>Family Room</option>
        </select>

        <label class="form-label">Check-in</label>
        <input class="form-control mb-3" name="checkIn" type="date" required>

        <label class="form-label">Check-out</label>
        <input class="form-control mb-3" name="checkOut" type="date" required>

        <label class="form-label">Guests</label>
        <input class="form-control mb-3" name="guests" type="number" min="1" max="6" required>

        <button type="submit" class="btn btn-primary">Book Now</button>
      </form>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
