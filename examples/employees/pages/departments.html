<h2 class="mb-3">Departments</h2>
<div id="depts"></div>
<script>
api('/api/data/employees').then(list => cards('#depts', DEPARTMENTS.map(d => {
  const people = list.filter(e => e.department === d);
  return {
    title: d, icon: 'building',
    text: people.map(e => e.employeeName).join(', ') || 'No employees yet',
    footer: `${people.length} employees · total salary ₹${people.reduce((s, e) => s + e.salary, 0).toLocaleString('en-IN')}`,
  };
})));
</script>
