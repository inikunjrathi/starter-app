<div id="banner" class="mb-4"></div>
<div class="row g-3" id="stats"></div>
<script>
carousel('#banner', ['images/banner1.svg', 'images/banner2.svg', 'images/banner3.svg']);
api('/api/data/employees').then(list => {
  const total = list.reduce((s, e) => s + e.salary, 0);
  document.getElementById('stats').innerHTML = [
    ['Employees', list.length, 'people'],
    ['Departments', new Set(list.map(e => e.department)).size, 'diagram-3'],
    ['Avg. Salary', '₹' + (list.length ? Math.round(total / list.length) : 0).toLocaleString('en-IN'), 'cash'],
  ].map(([k, v, icon]) => `<div class="col-md-4"><div class="card"><div class="card-body d-flex justify-content-between align-items-center">
    <div><small class="text-body-secondary">${k}</small><h3 class="mb-0">${v}</h3></div><i class="bi bi-${icon} fs-1 text-primary"></i>
  </div></div></div>`).join('');
});
</script>
