<!DOCTYPE html>
<html>
<head>
  <title>All Employees - Acme HR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<div class="d-flex">
  <!-- Vertical navbar (sidebar) -->
  <nav class="nav nav-pills flex-column bg-dark p-3 vh-100" style="width:220px" data-bs-theme="dark">
    <a class="navbar-brand text-white fs-4 mb-3" href="/home.html">Acme HR</a>
    <a class="nav-link" href="/home.html">Home</a>
    <a class="nav-link active" href="/employees.html">Employees</a>
    <a class="nav-link" href="/departments.html">Departments</a>
    <a class="nav-link" href="/contact.html">Contact Us</a>
    <a class="nav-link mt-auto" href="/">Logout</a>
  </nav>

  <div class="flex-grow-1 p-4">
    <h2 id="heading" class="mb-3">All Employees</h2>
    <table class="table table-striped table-bordered">
      <thead class="table-dark"><tr><th>Employee Name</th><th>Email</th><th>Department</th><th>Designation</th><th>Salary</th><th>Joining Date</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
// show only one department if the link has ?department=...
const department = new URLSearchParams(location.search).get("department");
if (department) document.getElementById("heading").textContent += " - " + department;

// get all records from MongoDB and add one table row per record
fetch("/api/employees")
  .then(res => res.json())
  .then(items => {
    const list = document.getElementById("list");
    items.forEach(item => {
      if (department && item.department !== department) return;
      const row = list.insertRow();
      row.insertCell().textContent = item.name;
      row.insertCell().textContent = item.email;
      row.insertCell().textContent = item.department;
      row.insertCell().textContent = item.designation;
      row.insertCell().textContent = item.salary;
      row.insertCell().textContent = item.joiningDate;
    });
  });
</script>

</body>
</html>
