<!DOCTYPE html>
<html>
<head>
  <title>My Bookings - CineMax</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-danger" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">CineMax</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/movies.html">Movies</a></li>
        <li class="nav-item"><a class="nav-link" href="/book.html">Book Tickets</a></li>
        <li class="nav-item"><a class="nav-link active" href="/bookings.html">My Bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2 id="heading" class="mb-3">My Bookings</h2>
  <table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Customer Name</th><th>Movie</th><th>Show Time</th><th>Date</th><th>Number of Tickets</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
// get all records from MongoDB and add one table row per record
fetch("/api/tickets")
  .then(res => res.json())
  .then(items => {
    const list = document.getElementById("list");
    items.forEach(item => {
      const row = list.insertRow();
      row.insertCell().textContent = item.customer;
      row.insertCell().textContent = item.movie;
      row.insertCell().textContent = item.showTime;
      row.insertCell().textContent = item.date;
      row.insertCell().textContent = item.tickets;
    });
  });
</script>

</body>
</html>
