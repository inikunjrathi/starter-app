<h2 class="mb-3">Categories</h2>
<div class="row g-3 mb-4" id="cats"></div>
<h4 id="catTitle"></h4>
<ul class="list-group" id="catBooks"></ul>
<script>
api('/api/data/books').then(books => {
  const show = cat => {
    document.getElementById('catTitle').textContent = cat;
    document.getElementById('catBooks').innerHTML = books.filter(b => b.category === cat).map(b =>
      `<li class="list-group-item d-flex justify-content-between"><span><b>${esc(b.bookName)}</b> by ${esc(b.authorName)}</span><span>₹${esc(b.price)}</span></li>`
    ).join('') || '<li class="list-group-item text-body-secondary">No books in this category yet</li>';
  };
  document.getElementById('cats').innerHTML = CATEGORIES.map(c => `
    <div class="col-6 col-md-4 col-lg-2"><button class="card w-100 text-center h-100" data-cat="${esc(c)}"><div class="card-body">
      <i class="bi bi-book fs-2 text-primary"></i><h6 class="mt-2 mb-0">${esc(c)}</h6>
      <small class="text-body-secondary">${books.filter(b => b.category === c).length} books</small>
    </div></button></div>`).join('');
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => show(b.dataset.cat));
  show(CATEGORIES[0]);
}).catch(e => document.getElementById('cats').textContent = e.message);
</script>
