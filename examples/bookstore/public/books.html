<!DOCTYPE html>
<html>
<head>
  <title>All Books - BookNook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">BookNook</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="/books.html">Books</a></li>
        <li class="nav-item"><a class="nav-link" href="/categories.html">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2 id="heading" class="mb-3">All Books</h2>
  <table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Book Name</th><th>Author Name</th><th>Category</th><th>Price</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
// show only one category if the link has ?category=...
const category = new URLSearchParams(location.search).get("category");
if (category) document.getElementById("heading").textContent += " - " + category;

// get all records from MongoDB and add one table row per record
fetch("/api/books")
  .then(res => res.json())
  .then(items => {
    const list = document.getElementById("list");
    items.forEach(item => {
      if (category && item.category !== category) return;
      const row = list.insertRow();
      row.insertCell().textContent = item.name;
      row.insertCell().textContent = item.author;
      row.insertCell().textContent = item.category;
      row.insertCell().textContent = item.price;
    });
  });
</script>

</body>
</html>
