<!DOCTYPE html>
<html>
<head>
  <title>Issued Books - City Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">City Library</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="/issued.html">Issued Books</a></li>
        <li class="nav-item"><a class="nav-link" href="/catalog.html">Book Catalog</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2 id="heading" class="mb-3">Issued Books</h2>
  <table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Student Name</th><th>Roll No</th><th>Book Title</th><th>Issue Date</th><th>Return Date</th><th>Status</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
// get all records from MongoDB and add one table row per record
fetch("/api/issues")
  .then(res => res.json())
  .then(items => {
    const list = document.getElementById("list");
    items.forEach(item => {
      const row = list.insertRow();
      row.insertCell().textContent = item.studentName;
      row.insertCell().textContent = item.rollNo;
      row.insertCell().textContent = item.bookTitle;
      row.insertCell().textContent = item.issueDate;
      row.insertCell().textContent = item.returnDate;
      row.insertCell().textContent = item.status;
    });
  });
</script>

</body>
</html>
