<!DOCTYPE html>
<html>
<head>
  <title>Home - City Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">City Library</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="/home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/issued.html">Issued Books</a></li>
        <li class="nav-item"><a class="nav-link" href="/catalog.html">Book Catalog</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <!-- Image carousel (slider) -->
  <div id="slider" class="carousel slide mb-4" data-bs-ride="carousel">
    <div class="carousel-inner rounded">
      <div class="carousel-item active">
        <img src="/images/banner1.svg" class="d-block w-100" alt="slide 1">
      </div>
      <div class="carousel-item">
        <img src="/images/banner2.svg" class="d-block w-100" alt="slide 2">
      </div>
      <div class="carousel-item">
        <img src="/images/banner3.svg" class="d-block w-100" alt="slide 3">
      </div>
    </div>
    <button class="carousel-control-prev" data-bs-target="#slider" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-target="#slider" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <div class="card" style="max-width:600px">
    <div class="card-body">
      <h4 class="mb-3">Issue Book</h4>
      <form action="/add" method="post">

        <label class="form-label">Student Name</label>
        <input class="form-control mb-3" name="studentName" type="text" required>

        <label class="form-label">Roll No</label>
        <input class="form-control mb-3" name="rollNo" type="text" required>

        <label class="form-label">Book Title</label>
        <select class="form-select mb-3" name="bookTitle" required>
          <option value="">Select Book Title</option>
          <option>Clean Code</option>
          <option>The Pragmatic Programmer</option>
          <option>Introduction to Algorithms</option>
          <option>Database System Concepts</option>
          <option>Operating System Concepts</option>
          <option>Computer Networks</option>
        </select>

        <label class="form-label">Issue Date</label>
        <input class="form-control mb-3" name="issueDate" type="date" required>

        <label class="form-label">Return Date</label>
        <input class="form-control mb-3" name="returnDate" type="date" required>

        <label class="form-label">Status</label>
        <select class="form-select mb-3" name="status" required>
          <option value="">Select Status</option>
          <option>Issued</option>
          <option>Returned</option>
        </select>

        <button type="submit" class="btn btn-primary">Issue Book</button>
      </form>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
