<h2 class="mb-3">Book Catalog</h2>
<div id="catalog"></div>
<script>
// copies available = total copies - currently issued
api('/api/data/issues').then(issues => {
  const out = title => issues.filter(i => i.bookTitle === title && i.status === 'Issued').length;
  cards('#catalog', BOOKS.map(b => ({
    title: b.title, text: `by ${b.author}`, icon: 'book',
    footer: `${b.copies - out(b.title)} of ${b.copies} copies available`,
  })));
});
</script>
