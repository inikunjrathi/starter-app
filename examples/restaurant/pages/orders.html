<h2 class="mb-3">My Orders</h2>
<div id="orders">Loading...</div>
<script>
api('/api/data/orders').then(orders => {
  document.getElementById('orders').innerHTML = orders.map(o => `
    <div class="card mb-2"><div class="card-body">
      <div class="d-flex justify-content-between"><b>${new Date(o.createdAt).toLocaleString()}</b><span class="badge bg-warning text-dark">${esc(o.status)}</span></div>
      <div class="small text-body-secondary my-1">${o.items.map(i => `${esc(i.name)} × ${i.qty}`).join(', ')}</div>
      <div class="d-flex justify-content-between"><span>To: ${esc(o.deliverTo)}</span><b>₹${o.total}</b></div>
    </div></div>`).join('') || '<p class="text-body-secondary">No orders yet. <a href="#menu">See the menu</a></p>';
}).catch(e => document.getElementById('orders').textContent = e.message);
</script>
