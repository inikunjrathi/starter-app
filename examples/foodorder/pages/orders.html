<h2 class="mb-3">My Orders</h2>
<div id="orders">Loading...</div>
<script>
const color = { Preparing: 'warning', 'Out for delivery': 'info', Delivered: 'success', Cancelled: 'secondary' };
api('/api/data/orders').then(orders => {
  document.getElementById('orders').innerHTML = orders.map(o => `
    <div class="card mb-2"><div class="card-body">
      <div class="d-flex justify-content-between">
        <b>${new Date(o.createdAt).toLocaleString()}</b>
        <span class="badge bg-${color[o.status] || 'secondary'}">${esc(o.status)}</span>
      </div>
      <ul class="small my-2">${o.items.map(i => `<li>${esc(i.name)} × ${i.qty}
        <span class="badge bg-${i.type === 'Veg' ? 'success' : 'danger'}">${esc(i.type)}</span></li>`).join('')}</ul>
      <div class="d-flex justify-content-between">
        <span class="text-body-secondary small">To: ${esc(o.address)}</span>
        <span>${o.discount ? `<span class="badge bg-success me-2">${esc(o.coupon)} −₹${o.discount}</span>` : ''}<b>₹${o.total}</b></span>
      </div>
    </div></div>`).join('') || '<p class="text-body-secondary">No orders yet. <a href="#menu">Browse the menu</a></p>';
}).catch(e => document.getElementById('orders').textContent = e.message);
</script>
