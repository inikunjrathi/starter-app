<div class="row g-4">
  <div class="col-lg-8">
    <h2 id="title" class="mb-3"></h2>
    <div class="mb-3" id="catButtons"></div>
    <div class="row g-3" id="items"></div>
  </div>
  <div class="col-lg-4">
    <div class="card sticky-top" style="top:1rem"><div class="card-body">
      <h4>Cart <span class="badge rounded-pill bg-primary" id="count">0</span></h4>
      <ul class="list-group list-group-flush mb-2" id="cartList"></ul>
      <div class="input-group input-group-sm mb-2">
        <input class="form-control" id="coupon" placeholder="Coupon code (see Offers)">
        <button class="btn btn-outline-secondary" id="apply">Apply</button>
      </div>
      <div id="summary"></div>
      <input class="form-control mb-2" id="address" placeholder="Delivery address">
      <button class="btn btn-success w-100" id="placeOrder">Place Order</button>
      <div id="msg" class="mt-2"></div>
    </div></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const cat = pageParams().cat;                       // from the navbar dropdown, e.g. #menu?cat=Desserts
let menu = [], offer = null;
let cart = JSON.parse(localStorage.getItem('foodCart') || '{}'); // { itemId: qty }
const save = () => { localStorage.setItem('foodCart', JSON.stringify(cart)); renderCart(); };

$('title').textContent = cat || 'All Items';
$('catButtons').innerHTML = ['All Items', ...CATEGORIES].map(c => {
  const target = c === 'All Items' ? 'menu' : `menu?cat=${c}`;
  return `<a href="#${encodeURI(target)}" class="btn btn-sm me-1 mb-1 ${(cat || 'All Items') === c ? 'btn-primary' : 'btn-outline-primary'}">${esc(c)}</a>`;
}).join('');

api('/api/data/fooditems').then(list => {
  menu = list;
  const shown = list.filter(i => !cat || i.category === cat);
  $('items').innerHTML = shown.map(i => {
    const available = i.availability === 'Available';
    return `<div class="col-sm-6"><div class="card h-100 ${available ? '' : 'opacity-50'}"><div class="card-body">
      <div class="mb-2">
        <span class="badge bg-${i.type === 'Veg' ? 'success' : 'danger'}">${esc(i.type)}</span>
        ${i.popular === 'Yes' ? '<span class="badge bg-warning text-dark"><i class="bi bi-star-fill"></i> Popular</span>' : ''}
        ${available ? '' : '<span class="badge bg-secondary">Not Available</span>'}
      </div>
      <h5 class="card-title">${esc(i.foodItemName)}</h5>
      <p class="card-text text-body-secondary small mb-2">${esc(i.category)}</p>
      <div class="d-flex justify-content-between align-items-center"><b>₹${esc(i.price)}</b>
        <button class="btn btn-sm btn-primary" data-add="${esc(i._id)}" ${available ? '' : 'disabled'}><i class="bi bi-cart-plus"></i> Add</button></div>
    </div></div></div>`;
  }).join('') || `<p class="text-body-secondary">No items${cat ? ' in ' + esc(cat) : ''} yet. Add some on the Home page.</p>`;
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { cart[b.dataset.add] = (cart[b.dataset.add] || 0) + 1; save(); });
  renderCart();
}).catch(e => $('items').textContent = e.message);

function totals() {
  const lines = menu.filter(i => cart[i._id] && i.availability === 'Available');
  const subtotal = lines.reduce((s, i) => s + i.price * cart[i._id], 0);
  const discount = offer && subtotal >= offer.min ? Math.round(subtotal * offer.percent / 100) : 0;
  return { lines, subtotal, discount, total: subtotal - discount };
}
function renderCart() {
  const { lines, subtotal, discount, total } = totals();
  $('cartList').innerHTML = lines.map(i => `
    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
      <span>${esc(i.foodItemName)}<br><small>₹${esc(i.price)} × ${cart[i._id]}</small></span>
      <span class="btn-group btn-group-sm"><button class="btn btn-outline-secondary" data-qty="${esc(i._id)},-1">−</button><button class="btn btn-outline-secondary" data-qty="${esc(i._id)},1">+</button></span>
    </li>`).join('') || '<li class="list-group-item px-0 text-body-secondary">Cart is empty</li>';
  $('count').textContent = lines.reduce((n, i) => n + cart[i._id], 0);
  $('summary').innerHTML = `<div class="d-flex justify-content-between"><span>Subtotal</span><span>₹${subtotal}</span></div>
    ${offer ? `<div class="d-flex justify-content-between text-success"><span>${esc(offer.code)} <span class="badge bg-success">${offer.percent}% OFF</span></span><span>−₹${discount}</span></div>
      ${subtotal < offer.min ? `<small class="text-danger">Add ₹${offer.min - subtotal} more to use this code</small>` : ''}` : ''}
    <h5 class="d-flex justify-content-between mt-1"><span>Total</span><span>₹${total}</span></h5>`;
  document.querySelectorAll('[data-qty]').forEach(b => b.onclick = () => {
    const [id, d] = b.dataset.qty.split(',');
    cart[id] += +d; if (cart[id] <= 0) delete cart[id]; save();
  });
}
$('apply').onclick = () => {
  offer = OFFERS.find(o => o.code === $('coupon').value.trim().toUpperCase()) || null;
  $('msg').innerHTML = offer ? '' : '<div class="alert alert-warning py-2">Invalid coupon code</div>';
  renderCart();
};
$('placeOrder').onclick = async () => {
  const { lines, subtotal, discount, total } = totals();
  if (!lines.length) return;
  if (!$('address').value.trim()) { $('msg').innerHTML = '<div class="alert alert-warning py-2">Enter a delivery address</div>'; return; }
  await api('/api/data/orders', {
    items: lines.map(i => ({ name: i.foodItemName, type: i.type, price: i.price, qty: cart[i._id] })),
    subtotal, discount, total, coupon: discount ? offer.code : '', address: $('address').value, status: 'Preparing',
  });
  cart = {}; offer = null; $('coupon').value = ''; $('address').value = ''; save();
  $('msg').innerHTML = '<div class="alert alert-success py-2">Order placed! See <a href="#orders">My Orders</a>.</div>';
};
</script>
