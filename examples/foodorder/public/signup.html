<!DOCTYPE html>
<html>
<head>
  <title>Sign Up - FoodieHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>


<div class="container my-4">
  <div class="card mx-auto mt-5" style="max-width:400px">
    <div class="card-body">
      <h2 class="text-center">FoodieHub</h2>
      <h5 class="text-center text-secondary mb-4">Sign Up</h5>
      <form action="/signup" method="post">
        <input class="form-control mb-3" name="name" placeholder="Full Name" required>
        <input class="form-control mb-3" name="email" type="email" placeholder="Email" required>
        <input class="form-control mb-3" name="password" type="password" placeholder="Password" minlength="6" required>
        <button type="submit" class="btn btn-success w-100">Sign Up</button>
      </form>
      <p class="text-center mt-3 mb-0">Already registered? <a href="/">Login</a></p>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
