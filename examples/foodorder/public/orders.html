<!DOCTYPE html>
<html>
<head>
  <title>My Orders - FoodieHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-danger" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">FoodieHub</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Menu</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/menu.html">All Items</a></li>
            <li><a class="dropdown-item" href="/menu.html?category=Starters">Starters</a></li>
            <li><a class="dropdown-item" href="/menu.html?category=Main Course">Main Course</a></li>
            <li><a class="dropdown-item" href="/menu.html?category=Desserts">Desserts</a></li>
            <li><a class="dropdown-item" href="/menu.html?category=Beverages">Beverages</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link active" href="/orders.html">My Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="/offers.html">Offers</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2 class="mb-3">My Orders</h2>
  <table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Food</th><th>Price</th><th>Quantity</th><th>Total</th><th>Customer</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
fetch("/api/orders")
  .then(res => res.json())
  .then(orders => {
    const list = document.getElementById("list");
    orders.forEach(o => {
      const row = list.insertRow();
      row.insertCell().textContent = o.food;
      row.insertCell().textContent = o.price;
      row.insertCell().textContent = o.quantity;
      row.insertCell().textContent = o.price * o.quantity;
      row.insertCell().textContent = o.customer;
    });
  });
</script>

</body>
</html>
