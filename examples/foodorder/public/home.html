<!DOCTYPE html>
<html>
<head>
  <title>Home - FoodieHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>

<!-- Horizontal navbar -->
<nav class="navbar navbar-expand-lg bg-danger" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="/home.html">FoodieHub</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="/home.html">Home</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Menu</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/menu.html">All Items</a></li>
            <li><a class="dropdown-item" href="/menu.html?category=Starters">Starters</a></li>
            <li><a class="dropdown-item" href="/menu.html?category=Main Course">Main Course</a></li>
            <li><a class="dropdown-item" href="/menu.html?category=Desserts">Desserts</a></li>
            <li><a class="dropdown-item" href="/menu.html?category=Beverages">Beverages</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link" href="/orders.html">My Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="/offers.html">Offers</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
      </ul>
      <a class="btn btn-light btn-sm" href="/">Logout</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <!-- Image carousel (slider) -->
  <div id="slider" class="carousel slide mb-4" data-bs-ride="carousel">
    <div class="carousel-inner rounded">
      <div class="carousel-item active">
        <img src="/images/banner1.svg" class="d-block w-100" alt="slide 1">
      </div>
      <div class="carousel-item">
        <img src="/images/banner2.svg" class="d-block w-100" alt="slide 2">
      </div>
      <div class="carousel-item">
        <img src="/images/banner3.svg" class="d-block w-100" alt="slide 3">
      </div>
    </div>
    <button class="carousel-control-prev" data-bs-target="#slider" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-target="#slider" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <div class="card" style="max-width:600px">
    <div class="card-body">
      <h4 class="mb-3">Food Item Management</h4>
      <form action="/add" method="post">

        <label class="form-label">Food Item Name</label>
        <input class="form-control mb-3" name="name" type="text" required>

        <label class="form-label">Category</label>
        <select class="form-select mb-3" name="category" required>
          <option value="">Select Category</option>
          <option>Starters</option>
          <option>Main Course</option>
          <option>Desserts</option>
          <option>Beverages</option>
        </select>

        <label class="form-label">Type</label>
        <select class="form-select mb-3" name="type" required>
          <option value="">Select Type</option>
          <option>Veg</option>
          <option>Non-Veg</option>
        </select>

        <label class="form-label">Price</label>
        <input class="form-control mb-3" name="price" type="number" min="1" required>

        <label class="form-label">Availability</label>
        <select class="form-select mb-3" name="availability" required>
          <option value="">Select Availability</option>
          <option>Available</option>
          <option>Not Available</option>
        </select>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="popular" value="Yes" id="popular">
          <label class="form-check-label" for="popular">Popular dish</label>
        </div>

        <button type="submit" class="btn btn-primary">Add Food Item</button>
      </form>
    </div>
  </div>
</div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
